<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audify - Desi K-Pop Fusion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: { dark: '#080c14', card: '#0f172a', border: '#1e293b', cyan: '#06b6d4', purple: '#a855f7', pink: '#ec4899', glow: '#22d3ee' }
                    },
                    fontFamily: { cyber: ['Orbitron', 'sans-serif'], mono: ['Share Tech Mono', 'monospace'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: #05070b;
            color: #e2e8f0;
            overflow-x: hidden;
        }
        .cyber-title {
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 0.15em;
            text-shadow: 0 0 15px rgba(6, 182, 212, 0.6), 0 0 30px rgba(168, 85, 247, 0.4);
        }
        .cyber-card {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.9) 0%, rgba(8, 12, 20, 0.95) 100%);
            border: 1px solid rgba(6, 182, 212, 0.3);
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.1), inset 0 0 15px rgba(168, 85, 247, 0.05);
            backdrop-filter: blur(12px);
        }
        .cyber-button {
            background: linear-gradient(135deg, #06b6d4 0%, #a855f7 100%);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .cyber-button:hover {
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.8), 0 0 10px rgba(6, 182, 212, 0.8);
            transform: translateY(-2px);
        }
        .neon-glow-icon {
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.7);
        }
        
        /* --- NEW ANIMATIONS --- */
        
        /* 1. Smooth Screen Fade & Slide */
        .screen-animate {
            animation: fadeSlideUp 0.5s ease-out forwards;
        }
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 2. Album Cover Reveal */
        .cover-reveal {
            animation: revealCover 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes revealCover {
            from { opacity: 0; transform: scale(0.8) rotate(-5deg); }
            to { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        /* 3. Audio Visualizer Bars */
        .visualizer-container {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 4px;
            height: 30px;
            margin-top: 10px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .visualizer-container.active {
            opacity: 1;
        }
        .vis-bar {
            width: 4px;
            background: linear-gradient(to top, #06b6d4, #a855f7);
            border-radius: 2px;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
            height: 5px;
        }
        /* Play state animation */
        .visualizer-container.active .vis-bar {
            animation: bounceBar 1s infinite alternate ease-in-out;
        }
        .vis-bar:nth-child(1) { animation-delay: 0.1s; }
        .vis-bar:nth-child(2) { animation-delay: 0.3s; }
        .vis-bar:nth-child(3) { animation-delay: 0.0s; }
        .vis-bar:nth-child(4) { animation-delay: 0.4s; }
        .vis-bar:nth-child(5) { animation-delay: 0.2s; }

        @keyframes bounceBar {
            0% { height: 5px; }
            100% { height: 30px; }
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.8; filter: drop-shadow(0 0 10px #06b6d4); }
            50% { opacity: 1; filter: drop-shadow(0 0 25px #a855f7); }
        }
        .animate-pulse-glow { animation: pulseGlow 3s infinite ease-in-out; }

        /* Custom Progress Bar & Volume Styling */
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: linear-gradient(to right, #a855f7 0%, #1e293b 0%);
            border-radius: 9999px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #a855f7;
            cursor: pointer;
            box-shadow: 0 0 10px #a855f7;
            transition: transform 0.1s ease;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative selection:bg-cyan-500 selection:text-black">

    <!-- Background Effects -->
    <div class="absolute inset-0 bg-[linear-gradient(to_right,#1e293b0a_1px,transparent_1px),linear-gradient(to_bottom,#1e293b0a_1px,transparent_1px)] bg-[size:3rem_3rem] pointer-events-none"></div>
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-96 h-96 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-10 right-10 w-80 h-80 bg-purple-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <header class="w-full max-w-xl mx-auto px-6 pt-12 pb-8 text-center z-10">
        <h1 class="cyber-title text-4xl sm:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-purple-400 to-pink-500">
            Audify
        </h1>
        <p class="text-cyan-400/80 text-xs sm:text-sm tracking-[0.25em] mt-3 uppercase font-mono">DESI K-POP FUSION</p>
    </header>

    <!-- 1. Main Home View -->
    <main id="home-view" class="screen-animate w-full max-w-xl mx-auto px-6 flex-1 flex flex-col justify-center gap-6 z-10 my-auto pb-10">
        <div class="cyber-card rounded-3xl p-8 sm:p-10 relative overflow-hidden group transition-all duration-300 hover:border-cyan-400">
            <div class="absolute -right-12 -top-12 w-48 h-48 bg-cyan-500/10 rounded-full blur-2xl group-hover:bg-purple-500/20 transition-all duration-500"></div>
            
            <div class="flex flex-col items-center text-center">
                <div class="w-24 h-24 rounded-full bg-gradient-to-br from-cyan-500 to-purple-600 p-0.5 mb-6 neon-glow-icon animate-pulse-glow flex items-center justify-center">
                    <div class="w-full h-full bg-slate-950 rounded-full flex items-center justify-center relative overflow-hidden">
                        <i class="fa-solid fa-compact-disc text-cyan-400 text-4xl animate-spin" style="animation-duration: 10s;"></i>
                        <div class="absolute w-5 h-5 bg-cyan-300 rounded-full shadow-[0_0_10px_#22d3ee]"></div>
                    </div>
                </div>

                <h2 class="font-cyber text-2xl sm:text-3xl font-bold text-white tracking-wider mb-3 group-hover:text-cyan-300 transition-colors">
                    Seoul x Karachi Vibzzz
                </h2>
                <p class="text-slate-400 text-sm max-w-md mb-6 leading-relaxed">
                    Blending BTS hits and soulful Pakistani tracks into one seamless audio lane.
                </p>

                <button onclick="startListeningDirectly()" class="inline-flex items-center text-xs sm:text-sm text-cyan-400 tracking-widest font-semibold hover:text-cyan-300 transition-colors">
                    <span>START LISTENING</span>
                    <i class="fa-solid fa-play ml-2 text-xs"></i>
                </button>
            </div>
        </div>

        <button onclick="openPlaylistScreen()" class="cyber-button w-full py-4 px-8 rounded-2xl flex items-center justify-between text-white font-cyber font-bold tracking-wider text-base group">
            <span class="flex items-center gap-3">
                <i class="fa-solid fa-layer-group text-cyan-200"></i>
                Playlist
            </span>
            <i class="fa-solid fa-chevron-right text-cyan-200 group-hover:translate-x-1 transition-transform"></i>
        </button>
    </main>

    <!-- 2. Playlist Screen -->
    <section id="playlist-screen" class="w-full max-w-xl mx-auto px-6 flex-1 hidden flex-col z-10 mb-10">
        <div class="cyber-card rounded-3xl p-6 sm:p-8 flex flex-col relative border border-cyan-500/40">
            <div class="flex items-center justify-between pb-4 border-b border-slate-800 mb-6">
                <button onclick="closePlaylistScreen()" class="flex items-center gap-2 text-cyan-400 hover:text-white transition-colors text-xs font-mono">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>BACK TO HOME</span>
                </button>
                <div class="flex items-center space-x-2">
                    <div class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-ping"></div>
                    <span class="font-cyber font-bold text-sm text-cyan-300 tracking-wider">AUDIFY PLAYLIST</span>
                </div>
            </div>

            <div id="playlist-container" class="space-y-3 max-h-[55vh] overflow-y-auto pr-1"></div>
        </div>
    </section>

    <!-- 3. Dedicated Song Player UI -->
    <section id="player-screen" class="w-full max-w-xl mx-auto px-6 flex-1 hidden flex-col z-10 mb-10 relative">
        
        <!-- Toast Notification -->
        <div id="toast-notification" class="absolute top-0 left-1/2 -translate-x-1/2 bg-slate-900 border border-cyan-500/50 text-cyan-300 px-4 py-1.5 rounded-full text-xs font-mono opacity-0 transition-opacity duration-300 pointer-events-none z-30 shadow-[0_0_10px_rgba(6,182,212,0.3)]">
            Shuffle: ON
        </div>

        <div class="cyber-card rounded-3xl p-6 sm:p-8 flex flex-col relative border border-purple-500/40 shadow-[0_0_30px_rgba(168,85,247,0.15)]">
            <div class="flex items-center justify-between pb-4 border-b border-slate-800 mb-6">
                <button onclick="backToPlaylist()" class="flex items-center gap-2 text-cyan-400 hover:text-white transition-colors text-xs font-mono">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>BACK TO PLAYLIST</span>
                </button>
                <span class="font-cyber text-xs text-purple-400 tracking-widest">NOW PLAYING</span>
            </div>

            <!-- Animated Cover Reveal -->
            <div class="cover-reveal relative w-full h-48 sm:h-56 rounded-2xl overflow-hidden mb-2 border border-slate-800 shadow-lg">
                <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-900/40 to-transparent z-10"></div>
                <div class="absolute inset-0 bg-gradient-to-br from-cyan-500/20 via-purple-600/30 to-pink-500/20 animate-pulse"></div>
                <div class="absolute inset-0 flex items-center justify-center z-20">
                    <div class="w-24 h-24 rounded-full bg-slate-950/80 border-2 border-cyan-400/60 flex items-center justify-center shadow-[0_0_20px_#06b6d4]">
                        <i id="spinning-disc" class="fa-solid fa-compact-disc text-cyan-400 text-4xl"></i>
                    </div>
                </div>
            </div>

            <!-- NEW: Audio Visualizer -->
            <div class="visualizer-container mb-4" id="visualizer">
                <div class="vis-bar"></div>
                <div class="vis-bar"></div>
                <div class="vis-bar"></div>
                <div class="vis-bar"></div>
                <div class="vis-bar"></div>
            </div>

            <div class="flex items-center justify-between mb-4">
                <div>
                    <h3 id="player-song-title" class="font-cyber font-bold text-xl text-white">Song Title</h3>
                    <p id="player-song-artist" class="text-cyan-400 text-sm">Artist Name</p>
                </div>
                <button onclick="toggleLike(this)" class="w-10 h-10 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center text-purple-400 hover:text-pink-500 transition-colors">
                    <i class="fa-solid fa-heart"></i>
                </button>
            </div>

            <!-- Working Progress Line & Minutes/Seconds -->
            <div class="w-full mb-4">
                <div class="flex justify-between text-xs text-slate-400 mb-1 font-mono">
                    <span id="current-time">0:00</span>
                    <span id="total-duration">0:00</span>
                </div>
                <input type="range" id="song-progress" value="0" max="100" class="w-full cursor-pointer">
            </div>

            <!-- Volume Control Bar -->
            <div class="flex items-center space-x-3 mb-6 bg-slate-950/60 p-3 rounded-xl border border-slate-800">
                <button onclick="toggleMute()" class="text-cyan-400 hover:text-white transition-colors text-sm w-5 text-center">
                    <i id="volume-icon" class="fa-solid fa-volume-high"></i>
                </button>
                <input type="range" id="volume-slider" min="0" max="100" value="100" class="w-full cursor-pointer">
                <span id="volume-text" class="text-xs font-mono text-slate-400 w-8 text-right">100%</span>
            </div>

            <div class="flex items-center justify-between px-4">
                <button id="shuffle-btn" onclick="toggleShuffle()" class="text-slate-400 hover:text-cyan-400 transition-colors text-sm">
                    <i class="fa-solid fa-shuffle"></i>
                </button>
                
                <button onclick="prevTrack()" class="text-white hover:text-cyan-400 transition-colors text-lg"><i class="fa-solid fa-backward-step"></i></button>
                
                <button onclick="togglePlayPause()" class="w-16 h-16 rounded-full cyber-button flex items-center justify-center text-white text-xl hover:scale-105 transition-all shadow-[0_0_25px_rgba(168,85,247,0.6)]">
                    <i id="player-play-icon" class="fa-solid fa-play ml-1"></i>
                </button>
                
                <button onclick="nextTrack()" class="text-white hover:text-cyan-400 transition-colors text-lg"><i class="fa-solid fa-forward-step"></i></button>
                
                <button id="repeat-btn" onclick="toggleRepeat()" class="text-slate-400 hover:text-cyan-400 transition-colors text-sm relative">
                    <i id="repeat-icon" class="fa-solid fa-repeat"></i>
                    <span id="repeat-badge" class="absolute -top-2 -right-2 text-[9px] font-bold bg-cyan-400 text-slate-950 px-1 rounded-full hidden">1</span>
                </button>
            </div>
        </div>
    </section>

    <audio id="audio-element" preload="auto"></audio>

    <footer class="w-full max-w-xl mx-auto px-6 py-6 text-center text-xs text-slate-600 font-mono z-10">
        &copy; AUDIFY SYSTEMS. ALL RIGHTS RESERVED.
    </footer>

    <script>
        const tracks = [
            { id: 1, title: "Dynamite", artist: "BTS", durationSec: 199, durationStr: "3:19", src: "audio/dynamite.mp3.mp3" },
            { id: 2, title: "Pasoori", artist: "Ali Sethi x Shae Gill", durationSec: 224, durationStr: "3:44", src: "audio/pasoori.mp3.mp3" },
            { id: 3, title: "Butter", artist: "BTS", durationSec: 164, durationStr: "2:44", src: "audio/butter.mp3.mp3" },
            { id: 4, title: "Kahani Suno 2.0", artist: "Kaifi Khalil", durationSec: 173, durationStr: "2:53", src: "audio/kahani-suno.mp3.mp3" },
            { id: 5, title: "Boy With Luv", artist: "BTS ft. Halsey", durationSec: 229, durationStr: "3:49", src: "audio/boy-with-luv.mp3.mp3" },
            { id: 6, title: "Blockbuster", artist: "Faris Shafi x Umair", durationSec: 185, durationStr: "3:05", src: "audio/blockbuster.mp3.mp3" }
        ];

        let currentTrackIndex = 0;
        let isPlaying = false;
        const audioElement = document.getElementById('audio-element');
        let isShuffle = false;
        let repeatMode = 0; 
        let currentTimeSec = 0;
        let timerInterval = null;

        function renderPlaylist() {
            const container = document.getElementById('playlist-container');
            if (!container) return;
            container.innerHTML = '';

            tracks.forEach((track, index) => {
                const isActive = index === currentTrackIndex;
                const item = document.createElement('div');
                item.className = `p-4 rounded-xl border flex items-center justify-between cursor-pointer transition-all ${
                    isActive ? 'bg-cyan-500/10 border-cyan-400/60 shadow-[0_0_15px_rgba(6,182,212,0.15)]' : 'bg-slate-900/60 border-slate-800 hover:border-cyan-500/30'
                }`;
                
                item.onclick = () => selectSongAndOpenPlayer(index);

                item.innerHTML = `
                    <div class="flex items-center space-x-4">
                        <div class="w-9 h-9 rounded-lg ${isActive ? 'bg-cyan-500 text-slate-950 font-bold shadow-[0_0_10px_#22d3ee]' : 'bg-slate-800 text-cyan-400'} flex items-center justify-center font-cyber text-xs">
                            ${index + 1}
                        </div>
                        <div>
                            <h4 class="font-cyber font-semibold text-sm ${isActive ? 'text-cyan-300' : 'text-white'}">${track.title}</h4>
                            <p class="text-xs text-slate-400">${track.artist}</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-3">
                        <span class="text-xs font-mono text-slate-500">${track.durationStr}</span>
                        <i class="fa-solid fa-play text-xs text-cyan-400"></i>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function hideAllScreens() {
            document.getElementById('home-view').classList.add('hidden');
            document.getElementById('playlist-screen').classList.add('hidden');
            document.getElementById('playlist-screen').classList.remove('flex');
            document.getElementById('player-screen').classList.add('hidden');
            document.getElementById('player-screen').classList.remove('flex');
        }

        // NEW: Screen Animation Helper
        function showScreenWithAnimation(screenId) {
            hideAllScreens();
            const screen = document.getElementById(screenId);
            screen.classList.remove('hidden');
            
            if(screenId === 'home-view') {
                screen.classList.add('screen-animate');
                // Remove animation class so it can replay if navigated back
                setTimeout(() => screen.classList.remove('screen-animate'), 500);
            } else {
                screen.classList.add('flex', 'screen-animate');
                setTimeout(() => screen.classList.remove('screen-animate'), 500);
            }
        }

        function startListeningDirectly() {
            showScreenWithAnimation('player-screen');
            currentTrackIndex = 0;
            currentTimeSec = 0;
            updatePlayerUI();
            playCurrentTrack();
        }

        function openPlaylistScreen() {
            showScreenWithAnimation('playlist-screen');
            renderPlaylist();
        }

        function closePlaylistScreen() {
            showScreenWithAnimation('home-view');
        }

        function selectSongAndOpenPlayer(index) {
            currentTrackIndex = index;
            currentTimeSec = 0;
            showScreenWithAnimation('player-screen');
            updatePlayerUI();
            playCurrentTrack();
        }

        function backToPlaylist() {
            showScreenWithAnimation('playlist-screen');
            renderPlaylist();
        }

        function playCurrentTrack() {
            const track = tracks[currentTrackIndex];
            audioElement.src = track.src;
            
            isPlaying = true;
            updatePlayButtonIcon();
            startTimer();

            audioElement.play().catch(err => {
                console.log("Audio play fallback active.");
            });
        }

        function pauseCurrentTrack() {
            isPlaying = false;
            audioElement.pause();
            stopTimer();
            updatePlayButtonIcon();
        }

        function togglePlayPause() {
            if (isPlaying) {
                pauseCurrentTrack();
            } else {
                playCurrentTrack();
            }
        }

        function startTimer() {
            stopTimer();
            timerInterval = setInterval(() => {
                if (isPlaying) {
                    const track = tracks[currentTrackIndex];
                    if (currentTimeSec >= track.durationSec) {
                        nextTrack();
                        return;
                    }
                    currentTimeSec++;
                    updateProgressUI();
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function updateProgressUI() {
            const track = tracks[currentTrackIndex];
            const curMins = Math.floor(currentTimeSec / 60);
            const curSecs = currentTimeSec % 60;
            document.getElementById('current-time').innerText = `${curMins}:${curSecs < 10 ? '0' : ''}${curSecs}`;

            const percent = (currentTimeSec / track.durationSec) * 100;
            const progressBar = document.getElementById('song-progress');
            progressBar.value = percent;
            progressBar.style.background = `linear-gradient(to right, #a855f7 ${percent}%, #1e293b ${percent}%)`;
        }

        document.getElementById('song-progress').addEventListener('input', (e) => {
            const val = e.target.value;
            const track = tracks[currentTrackIndex];
            currentTimeSec = Math.floor((val / 100) * track.durationSec);
            
            if (audioElement.duration) {
                audioElement.currentTime = (val / 100) * audioElement.duration;
            }
            updateProgressUI();
        });

        const volumeSlider = document.getElementById('volume-slider');
        volumeSlider.addEventListener('input', (e) => {
            const vol = e.target.value;
            audioElement.volume = vol / 100;
            document.getElementById('volume-text').innerText = `${vol}%`;
            
            const volIcon = document.getElementById('volume-icon');
            if (vol == 0) {
                volIcon.className = "fa-solid fa-volume-xmark text-pink-500";
            } else if (vol < 50) {
                volIcon.className = "fa-solid fa-volume-low text-cyan-400";
            } else {
                volIcon.className = "fa-solid fa-volume-high text-cyan-400";
            }
            
            volumeSlider.style.background = `linear-gradient(to right, #06b6d4 ${vol}%, #1e293b ${vol}%)`;
        });

        function toggleMute() {
            if (audioElement.volume > 0) {
                audioElement.volume = 0;
                volumeSlider.value = 0;
                document.getElementById('volume-text').innerText = "0%";
                document.getElementById('volume-icon').className = "fa-solid fa-volume-xmark text-pink-500";
                volumeSlider.style.background = `linear-gradient(to right, #06b6d4 0%, #1e293b 0%)`;
            } else {
                audioElement.volume = 1;
                volumeSlider.value = 100;
                document.getElementById('volume-text').innerText = "100%";
                document.getElementById('volume-icon').className = "fa-solid fa-volume-high text-cyan-400";
                volumeSlider.style.background = `linear-gradient(to right, #06b6d4 100%, #1e293b 100%)`;
            }
        }

        function nextTrack() {
            if (repeatMode === 2) {
                currentTimeSec = 0;
            } else if (isShuffle) {
                currentTrackIndex = Math.floor(Math.random() * tracks.length);
                currentTimeSec = 0;
            } else {
                currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
                currentTimeSec = 0;
            }
            updatePlayerUI();
            playCurrentTrack();
        }

        function prevTrack() {
            currentTrackIndex = (currentTrackIndex - 1 + tracks.length) % tracks.length;
            currentTimeSec = 0;
            updatePlayerUI();
            playCurrentTrack();
        }

        function toggleShuffle() {
            isShuffle = !isShuffle;
            const btn = document.getElementById('shuffle-btn');
            if (isShuffle) {
                btn.classList.remove('text-slate-400');
                btn.classList.add('text-cyan-400', 'drop-shadow-[0_0_8px_#06b6d4]');
                showToast("Shuffle: ON");
            } else {
                btn.classList.remove('text-cyan-400', 'drop-shadow-[0_0_8px_#06b6d4]');
                btn.classList.add('text-slate-400');
                showToast("Shuffle: OFF");
            }
        }

        function toggleRepeat() {
            repeatMode = (repeatMode + 1) % 3;
            const btn = document.getElementById('repeat-btn');
            const badge = document.getElementById('repeat-badge');

            if (repeatMode === 0) {
                btn.classList.remove('text-cyan-400', 'drop-shadow-[0_0_8px_#06b6d4]');
                btn.classList.add('text-slate-400');
                badge.classList.add('hidden');
                showToast("Repeat: OFF");
            } else if (repeatMode === 1) {
                btn.classList.remove('text-slate-400');
                btn.classList.add('text-cyan-400', 'drop-shadow-[0_0_8px_#06b6d4]');
                badge.classList.add('hidden');
                showToast("Repeat: ALL");
            } else if (repeatMode === 2) {
                btn.classList.add('text-cyan-400', 'drop-shadow-[0_0_8px_#06b6d4]');
                badge.classList.remove('hidden');
                showToast("Repeat: ONE");
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast-notification');
            if (!toast) return;
            toast.innerText = message;
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.opacity = '0';
            }, 1500);
        }

        function updatePlayerUI() {
            const track = tracks[currentTrackIndex];
            document.getElementById('player-song-title').innerText = track.title;
            document.getElementById('player-song-artist').innerText = track.artist;
            document.getElementById('total-duration').innerText = track.durationStr;
            updateProgressUI();
            updatePlayButtonIcon();
        }

        // NEW: Added visualizer logic here
        function updatePlayButtonIcon() {
            const icon = document.getElementById('player-play-icon');
            const disc = document.getElementById('spinning-disc');
            const visualizer = document.getElementById('visualizer');
            
            if (icon) {
                icon.className = isPlaying ? "fa-solid fa-pause" : "fa-solid fa-play ml-1";
            }
            if (disc) {
                if (isPlaying) {
                    disc.classList.add('animate-spin');
                } else {
                    disc.classList.remove('animate-spin');
                }
            }
            // Toggle visualizer animation
            if (visualizer) {
                if (isPlaying) {
                    visualizer.classList.add('active');
                } else {
                    visualizer.classList.remove('active');
                }
            }
        }

        function toggleLike(btn) {
            const icon = btn.querySelector('i');
            if (icon.classList.contains('text-pink-500')) {
                icon.classList.remove('text-pink-500');
            } else {
                icon.classList.add('text-pink-500');
            }
        }

        window.onload = function() {
            renderPlaylist();
            document.getElementById('volume-slider').style.background = `linear-gradient(to right, #06b6d4 100%, #1e293b 100%)`;
        };
    </script>
</body>
</html>
