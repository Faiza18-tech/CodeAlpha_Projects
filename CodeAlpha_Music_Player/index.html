<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audify - Music Player 2.0</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome (Icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS File Link -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-4">

    <!-- Main App Container -->
    <div class="w-full max-w-[380px] h-[800px] max-h-[95vh] neu-chassis sm:rounded-[40px] flex flex-col relative overflow-hidden border-0 sm:border-2 border-[#241a3e]">
        
        <!-- HEADER -->
        <header class="w-full px-6 pt-6 pb-2 flex items-center justify-between shrink-0 z-10">
            <div class="w-10 h-10 shrink-0">
                <button onclick="goBack()" id="back-btn" class="w-full h-full rounded-xl neu-btn flex items-center justify-center text-slate-300 transition-colors opacity-0 pointer-events-none" disabled>
                    <i class="fa-solid fa-chevron-left text-xs"></i>
                </button>
            </div>
            
            <span id="header-title" class="luxury-logo text-lg uppercase">AUDIFY</span>
            
            <div class="w-10 h-10 shrink-0"></div>
        </header>

        <!-- MAIN CONTENT AREA -->
        <div class="flex-1 flex flex-col px-6 overflow-y-auto no-scrollbar relative">

            <!-- HOME VIEW -->
            <section id="home-view" class="w-full h-full flex flex-col justify-between screen-fade py-2">
                
                <!-- Headphone -->
                <div class="w-full flex-1 flex items-center justify-center min-h-[200px]">
                    <div class="glow-ring w-44 h-44 flex items-center justify-center">
                        <i class="fa-solid fa-headphones text-5xl text-orange-500 glow-headphone"></i>
                    </div>
                </div>

                <!-- Text and Button -->
                <div class="w-full space-y-4 mt-4 pb-2">
                    <div class="text-left w-full px-2 space-y-2">
                        <h1 class="text-4xl font-light leading-tight tracking-wide">
                            <span class="luxury-text-grey">Enjoy your</span> <br>
                            <span class="luxury-text-orange font-extrabold font-cyber">music,</span> 
                            <span class="luxury-text-grey">Enjoy</span> <br>
                            <span class="luxury-text-grey">your</span> 
                            <span class="luxury-text-orange font-extrabold font-cyber">life</span>
                        </h1>
                        <p class="text-xs text-slate-400 font-medium tracking-wide pt-1">
                            listen to your favorite music for free, anywhere.
                        </p>
                    </div>

                    <div class="w-full px-1">
                        <button onclick="startListening()" class="w-full py-4 px-6 rounded-2xl neu-orange-btn text-white font-bold text-xs tracking-wider uppercase flex items-center justify-between">
                            <span>GET STARTED</span>
                            <i class="fa-solid fa-angles-right text-xs"></i>
                        </button>
                    </div>
                </div>
            </section>

            <!-- PLAYLIST VIEW -->
            <section id="playlist-view" class="w-full flex-1 hidden flex-col screen-fade py-2">
                <div class="flex items-center justify-between mb-4 px-1">
                    <div class="flex items-center space-x-3">
                        <div class="w-11 h-11 rounded-xl neu-inset flex items-center justify-center shrink-0">
                            <i class="fa-solid fa-music text-orange-500 text-sm"></i>
                        </div>
                        <div>
                            <h3 class="font-cyber font-bold text-xs text-slate-200">LOCAL PLAYLIST</h3>
                            <p class="text-[10px] text-slate-400 mt-0.5">12 Tracks</p>
                        </div>
                    </div>
                    <button onclick="toggleLikeActive(this)" class="w-9 h-9 rounded-xl neu-btn flex items-center justify-center text-slate-400">
                        <i class="fa-solid fa-heart text-xs"></i>
                    </button>
                </div>

                <div id="playlist-container" class="space-y-2.5 overflow-y-auto no-scrollbar pb-4"></div>
            </section>

            <!-- PLAYER VIEW -->
            <section id="player-view" class="w-full flex-col items-center justify-between space-y-4 screen-fade hidden my-auto h-full">
                <div class="relative w-48 h-48 sm:w-52 sm:h-52 neu-inset rounded-full p-2.5 flex items-center justify-center mt-2">
                    <div class="w-full h-full rounded-full overflow-hidden relative neu-card border-2 border-[#22183b]">
                        <img id="player-cover" src="images/Believer – Imagine Dragons.jpg" alt="Album Art" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-black/10"></div>
                    </div>
                </div>

                <div class="text-center w-full px-2">
                    <h2 id="player-song-title" class="font-cyber font-bold text-lg text-slate-100 tracking-wide truncate">Believer</h2>
                    <p id="player-song-artist" class="text-xs text-slate-400 font-medium mt-0.5 tracking-wider">Imagine Dragons</p>
                </div>

                <div class="w-full px-1">
                    <div class="flex justify-between text-[11px] text-slate-400 mb-1.5 font-mono">
                        <span id="current-time">0:00</span>
                        <span id="total-duration">3:24</span>
                    </div>
                    <div class="neu-inset p-2 rounded-full flex items-center">
                        <input type="range" id="song-progress" value="0" max="100" class="styled-slider">
                    </div>
                </div>

                <div class="flex items-center justify-center space-x-6 w-full pt-1">
                    <button onclick="prevTrack()" class="w-12 h-12 rounded-full neu-btn flex items-center justify-center text-slate-300">
                        <i class="fa-solid fa-backward-step text-sm"></i>
                    </button>
                    
                    <button onclick="togglePlayPause()" class="w-16 h-16 rounded-full neu-orange-btn flex items-center justify-center text-white text-xl">
                        <i id="player-play-icon" class="fa-solid fa-pause"></i>
                    </button>
                    
                    <button onclick="nextTrack()" class="w-12 h-12 rounded-full neu-btn flex items-center justify-center text-slate-300">
                        <i class="fa-solid fa-forward-step text-sm"></i>
                    </button>
                </div>

                <div class="w-full px-1 flex items-center space-x-3 pt-1 pb-4">
                    <button onclick="toggleMute()" class="text-slate-400">
                        <i id="volume-icon" class="fa-solid fa-volume-high text-xs"></i>
                    </button>
                    <div class="w-full flex items-center neu-inset p-1.5 rounded-full">
                        <input type="range" id="volume-slider" min="0" max="100" value="80" class="styled-slider">
                    </div>
                </div>
            </section>

        </div>

        <!-- FOOTER -->
        <footer class="w-full px-6 py-4 neu-inset border-t border-[#1d1632] flex items-center justify-center text-[9px] text-slate-500 shrink-0 font-cyber tracking-widest font-medium z-10 bg-[#120e21]">
            AUDIFY V2.0
        </footer>

    </div>

    <!-- Audio Element -->
    <audio id="audio-element" preload="auto"></audio>

    <!-- Custom JS File Link -->
    <script src="script.js"></script>
</body>
</html>
